[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x2t"
version = "0.1.0"
description = "High-performance, multi-media downloader engine for Twitter / X posts"
authors = [
    { name = "TheMRVX Marvi", email = "TheMRVX@users.noreply.github.com" },
    { name = "Antigravity (Google DeepMind)" },
]
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.08.06",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "aiogram>=3.10.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "pyrogram>=2.0.106",
    "tgcrypto>=1.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["x2t*"]

[project.scripts]
x2t = "x2t.__main__:main"
